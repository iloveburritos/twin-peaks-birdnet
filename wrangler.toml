name = "twin-peaks-birdnet"
main = "src/index.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/clips/*"]

[vars]
STATION_NAME = "Twin Peaks BirdNET"
# Hours a detection waits before it appears publicly, so false positives
# can be deleted on the Pi first. Set to "0" to publish immediately.
PUBLISH_DELAY_HOURS = "24"

[[d1_databases]]
binding = "DB"
database_name = "twin-peaks-birds"
database_id = "c159e453-5086-46a1-b9b1-63dc8a7c8cd1"

[[r2_buckets]]
binding = "CLIPS"
bucket_name = "twin-peaks-clips"
